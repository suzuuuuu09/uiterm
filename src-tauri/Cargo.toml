[package]
name = "uiterm"
version = "0.0.1"
description = "uiterm native backend"
edition = "2024"
default-run = "uiterm"

[lib]
name = "uiterm_lib"
crate-type = ["rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "process",
  "sync",
  "time",
  "macros",
  "signal",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
ts-rs = "12.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
