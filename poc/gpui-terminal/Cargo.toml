[package]
name = "uiterm-gpui-poc"
version = "0.0.1"
edition = "2024"
publish = false
description = "ADR-0010 PoC: GPUI rendering, Japanese IME, Nerd Font quality, and herdr-core integration"

[features]
# Allow building on macOS with Xcode Command Line Tools (without full Xcode's xcrun metal).
default = ["runtime_shaders"]
runtime_shaders = ["gpui/runtime_shaders"]

[dependencies]
ghostty-vt = { version = "0.9.0", default-features = false }
gpui = "0.2.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"net",
	"io-util",
	"process",
	"sync",
	"time",
	"macros",
] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false
