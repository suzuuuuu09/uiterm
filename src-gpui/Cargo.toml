[package]
name = "uiterm"
version = "0.0.1"
edition = "2024"
publish = false
default-run = "uiterm"
description = "uiterm native terminal"

[features]
# Allow building on macOS with Xcode Command Line Tools (without full Xcode's xcrun metal).
default = ["runtime_shaders"]
runtime_shaders = ["gpui/runtime_shaders"]

[dependencies]
ghostty-vt = { version = "0.9.0", default-features = false }
# shortcut: GPUI 0.2.2's xattr 0.2.3 fails on Linux with libc >=0.2.190;
# remove the mio/libc lockfile pins once GPUI updates xattr.
gpui = "0.2.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "process",
  "sync",
  "time",
  "macros",
] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false
